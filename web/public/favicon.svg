<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- The plus is cut out of the planet rather than laid on top of it, so the
         mark keeps working wherever it lands: the plate shows through here, the
         page background shows through on the homepage. An opaque plus would
         have to guess which one it is sitting on. -->
    <mask id="ng-plus">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M28 21h8v7h7v8h-7v7h-8v-7h-7v-8h7z"/>
    </mask>
  </defs>

  <rect width="64" height="64" rx="14" fill="#07001a"/>

  <!-- Masked as one group, so the cut-out reaches the ring too. Masking only the
       planet would punch a hole that the ring behind it shows straight through.
       The ring also passes entirely behind: drawing its front arc across the face
       is the more literal Saturn, but it slices the plus into pieces at exactly
       the sizes a favicon is actually seen at. -->
  <g mask="url(#ng-plus)">
    <ellipse cx="32" cy="32" rx="27" ry="9.5" transform="rotate(-20 32 32)"
             fill="none" stroke="#ffcf00" stroke-width="4.5"/>
    <circle cx="32" cy="32" r="18" fill="#00f5ff"/>
  </g>
</svg>
