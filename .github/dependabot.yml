version: 2
updates:
- package-ecosystem: npm
  directory: /web
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 10
  # Packages that constrain each other's versions have to arrive in one pull
  # request. `@vitest/coverage-v8` pins `vitest` to an exact version, so a lone
  # patch bump of either leaves an unsatisfiable tree; the React stack and the
  # ESLint toolchain are looser but fail the same way on a major.
  groups:
    react:
      patterns:
      - react
      - react-dom
      - react-router
      - '@types/react'
      - '@types/react-dom'
      - '@testing-library/*'
    vitest:
      patterns:
      - vitest
      - '@vitest/*'
    vite:
      patterns:
      - vite
      - '@vitejs/*'
    playwright:
      patterns:
      - '@playwright/*'
      - '@axe-core/*'
      - axe-core
    eslint:
      patterns:
      - eslint
      - eslint-*
      - '@eslint/*'
      - '@stylistic/*'
      - '@babel/*'
      - globals
    typescript:
      patterns:
      - typescript
      - '@types/*'
      # Order between groups is not something to rely on, so the two `@types`
      # packages that belong with React say so here rather than by position.
      exclude-patterns:
      - '@types/react'
      - '@types/react-dom'
  labels:
  - dependencies
  - npm
  # `include: scope` appends the "(deps)" / "(deps-dev)" scope itself; a
  # prefix that named it too produced "chore(deps-dev)(deps-dev): …".
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: ci
    include: scope
