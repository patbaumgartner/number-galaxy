  <title>Math Invaders</title>
  <script>
    // Single Page Apps for GitHub Pages — restore redirect from 404.html
    // https://github.com/rafgraph/spa-github-pages
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&');
          });
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) +
          decoded[0] +
          (decoded[1] ? '?' + decoded[1] : '') +
          l.hash
        );
      }
    })(window.location);
  </script>
</head>

  <div id="root"></div>
