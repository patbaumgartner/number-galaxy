name: Dependabot Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  # To dispatch CI on main after the merge — see dispatchCi below.
  actions: write

# A pull request that is pushed to again supersedes its own waiter. Dependabot
# rebases on every change to main, and without this each rebase leaves another
# job polling the same pull request for half an hour, all of them racing to
# merge it.
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The wait-and-merge fallback below gives up after ~30 minutes. This is the
    # backstop for a job that somehow does not, so a stuck waiter cannot sit on
    # a runner for the six-hour default.
    timeout-minutes: 40
    steps:
      - name: Approve, wait for checks, and merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const selfJob = context.job;
            const blockedLabel = "automerge-blocked";
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function ensureLabel() {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: blockedLabel });
              } catch (error) {
                if (error.status !== 404) return;
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: blockedLabel,
                    color: "b60205",
                    description: "Dependabot PR could not be auto-merged",
                  });
                } catch (createError) {
                  core.info(`Could not create label: ${createError.message}`);
                }
              }
            }

            async function block(reason) {
              core.warning(`Auto-merge blocked: ${reason}`);
              await ensureLabel();
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: [blockedLabel],
                });
              } catch (error) {
                core.info(`Could not add label: ${error.message}`);
              }
              try {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `🚧 **Auto-merge blocked** — ${reason}.\n\nThe pull request was left open for manual review. Fix the issue (or merge manually) and Dependabot / re-running this workflow will pick it up again.`,
                });
              } catch (error) {
                core.info(`Could not comment: ${error.message}`);
              }
            }

            async function clearBlock() {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: blockedLabel,
                });
              } catch (error) {
                // Label was not present; nothing to clear.
              }
            }

            // A merge made with GITHUB_TOKEN fires no `on: push` run — the
            // commit lands on main with no verdict and the Pages deploy never
            // happens. `workflow_dispatch` is the documented exception, so the
            // merged branch is handed to CI here. A failed dispatch fails this
            // run loudly: the alternative is a silently stale site.
            async function dispatchCi(ref) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: "ci.yml",
                  ref,
                });
                core.info(`Dispatched CI on ${ref}.`);
              } catch (error) {
                core.setFailed(
                  `Merged, but dispatching CI on ${ref} failed: ${error.message}. ` +
                  "Run the CI workflow on main by hand so the merge is tested and deployed."
                );
              }
            }

            // 1. Approve the pull request (idempotent).
            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                event: "APPROVE",
                body: "Auto-approving Dependabot pull request.",
              });
            } catch (error) {
              core.info(`Approval skipped: ${error.message}`);
            }

            // 2. Choose a merge method the repository actually allows.
            const { data: repoData } = await github.rest.repos.get({ owner, repo });
            const mergeMethod = repoData.allow_squash_merge
              ? "squash"
              : repoData.allow_rebase_merge
                ? "rebase"
                : repoData.allow_merge_commit
                  ? "merge"
                  : null;

            if (!mergeMethod) {
              await block("no merge method is enabled in the repository settings");
              core.setFailed("No merge method is enabled for this repository.");
              return;
            }

            // 3. Prefer GitHub's native auto-merge (used when branch protection is configured).
            try {
              const query = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) { id }
                  }
                }`,
                { owner, repo, number: prNumber }
              );
              await github.graphql(
                `mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: $mergeMethod }) {
                    clientMutationId
                  }
                }`,
                { pullRequestId: query.repository.pullRequest.id, mergeMethod: mergeMethod.toUpperCase() }
              );
              core.info(`Native auto-merge enabled (${mergeMethod}); GitHub will merge when required checks pass.`);
              // Fall through to the polling loop rather than returning: the
              // native merge is made with GITHUB_TOKEN too, so somebody still
              // has to see it land and dispatch CI — the loop's merged check
              // does exactly that.
            } catch (error) {
              const message = error.errors?.map((entry) => entry.message).join("; ") || error.message || "";
              core.info(`Native auto-merge unavailable (${message}); falling back to wait-and-merge.`);
            }

            // 4. Wait for checks, then merge directly (unless the native
            //    auto-merge above gets there first) and hand the result to CI.
            const maxAttempts = 60; // ~30 minutes at 30s intervals.
            const intervalMs = 30000;

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (pr.merged) {
                core.info("Pull request already merged.");
                await dispatchCi(pr.base.ref);
                return;
              }
              if (pr.state !== "open") {
                core.info(`Pull request is ${pr.state}; nothing to merge.`);
                return;
              }

              const sha = pr.head.sha;
              const checkRuns = (
                await github.paginate(github.rest.checks.listForRef, {
                  owner,
                  repo,
                  ref: sha,
                  per_page: 100,
                })
              ).filter((run) => run.name !== selfJob);
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });

              const pendingChecks = checkRuns.filter((run) => run.status !== "completed");
              const failedChecks = checkRuns.filter(
                (run) => run.status === "completed" && !["success", "skipped", "neutral"].includes(run.conclusion)
              );
              const statuses = combined.statuses || [];
              const statusPending = statuses.some((entry) => entry.state === "pending");
              const statusFailed = combined.state === "failure" || combined.state === "error";

              if (failedChecks.length > 0 || statusFailed) {
                const names = failedChecks.map((run) => run.name).join(", ") || combined.state;
                await block(`failing checks (${names})`);
                return;
              }

              // Nothing has registered a check run yet. That is not the same as
              // everything having passed, but the two are identical to the test
              // below — an empty list has no pending entries — so a poll that
              // lands in the gap merges a pull request nothing has verified.
              // This workflow starts on the same event that starts CI and has
              // won that race by as little as four seconds, so the gap is real.
              // Waiting is safe: if the checks never arrive, the loop times out
              // and blocks.
              if (checkRuns.length === 0 && statuses.length === 0) {
                core.info(`Waiting for checks to be registered (attempt ${attempt}/${maxAttempts}).`);
                await sleep(intervalMs);
                continue;
              }

              if (pendingChecks.length === 0 && !statusPending) {
                if (pr.mergeable === false) {
                  await block("the pull request has a merge conflict");
                  return;
                }
                try {
                  await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: prNumber,
                    merge_method: mergeMethod,
                  });
                  await clearBlock();
                  core.info(`Merged pull request #${prNumber} using ${mergeMethod}.`);
                  await dispatchCi(pr.base.ref);
                  return;
                } catch (error) {
                  core.info(`Merge attempt ${attempt} failed: ${error.message}; retrying.`);
                }
              } else {
                core.info(
                  `Waiting for checks (attempt ${attempt}/${maxAttempts}): ${pendingChecks.length} pending check run(s).`
                );
              }

              await sleep(intervalMs);
            }

            await block("required checks did not complete within the auto-merge timeout");
