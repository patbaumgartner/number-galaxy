<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <title>Zahlen-Galaxie</title>
    <script>
        // Single Page Apps for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        // 0 segments: the app is served from the root of the custom domain
        // (galaxy.patbaumgartner.com). A repository-named project site under
        // /<repo>/ would use 1, keeping the repo segment in the URL.
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
            l.protocol +
            '//' +
            l.host +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
            '/?/' +
            l.pathname
                .slice(1)
                .split('/')
                .slice(pathSegmentsToKeep)
                .join('/')
                .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body></body>

</html>
