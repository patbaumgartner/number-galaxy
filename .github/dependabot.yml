version: 2
updates:
- package-ecosystem: npm
  directory: /web
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Zurich
  open-pull-requests-limit: 10
  groups:
    react:
      patterns:
      - react
      - react-dom
      - react-router
      - '@types/react'
      - '@types/react-dom'
      - '@testing-library/*'
    vitest:
      patterns:
      - vitest
      - '@vitest/*'
    vite:
      patterns:
      - vite
      - '@vitejs/*'
    playwright:
      patterns:
      - '@playwright/*'
      - '@axe-core/*'
      - axe-core
    eslint:
      patterns:
      - eslint
      - eslint-*
      - '@eslint/*'
      - '@stylistic/*'
      - '@babel/*'
      - globals
    typescript:
      patterns:
      - typescript
      - '@types/*'
      exclude-patterns:
      - '@types/react'
      - '@types/react-dom'
  labels:
  - dependencies
  - npm
  commit-message:
    prefix: chore
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: ci
    include: scope
  groups:
    multi-step-actions:
      patterns:
      - github/codeql-action/*
