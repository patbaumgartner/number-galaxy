<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <title>Zahlen-Galaxie</title>
    <script>
        // Single Page Apps for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        // 1 segment: a project site is served from /<repo>/, which has to stay
        // in the URL for the app to be found. A user or org site would use 0.
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
            l.protocol +
            '//' +
            l.host +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
            '/?/' +
            l.pathname
                .slice(1)
                .split('/')
                .slice(pathSegmentsToKeep)
                .join('/')
                .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body></body>

</html>
