<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="5" fill="#0a0a0a"/>

  <!-- Stars -->
  <circle cx="5"  cy="5"  r="1"   fill="#ffffff" opacity="0.7"/>
  <circle cx="27" cy="4"  r="0.8" fill="#ffffff" opacity="0.6"/>
  <circle cx="25" cy="11" r="0.7" fill="#ffffff" opacity="0.4"/>
  <circle cx="4"  cy="20" r="0.7" fill="#ffffff" opacity="0.5"/>
  <circle cx="28" cy="22" r="0.8" fill="#ffffff" opacity="0.5"/>

  <!-- Rocket nose cone -->
  <path d="M16 3 L21 13 L11 13 Z" fill="#00ffff"/>
  <!-- Glow on nose -->
  <path d="M16 4 L20 12 L16 9 Z" fill="#ffffff" opacity="0.25"/>

  <!-- Rocket body -->
  <rect x="11" y="12" width="10" height="9" rx="1" fill="#00ffff"/>

  <!-- Porthole -->
  <circle cx="16" cy="16" r="2.5" fill="#0a0a0a"/>
  <circle cx="16" cy="16" r="1.5" fill="#ff00ff"/>

  <!-- Left fin -->
  <path d="M11 17 L7 23 L11 21 Z" fill="#ff00ff"/>
  <!-- Right fin -->
  <path d="M21 17 L25 23 L21 21 Z" fill="#ff00ff"/>

  <!-- Outer flame -->
  <path d="M12 21 L16 31 L20 21 Z" fill="#ffff00"/>
  <!-- Inner flame (orange core) -->
  <path d="M14 21 L16 27 L18 21 Z" fill="#ff6600"/>
</svg>
