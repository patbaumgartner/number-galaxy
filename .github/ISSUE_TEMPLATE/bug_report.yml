name: Bug Report
description: Create a report to help us improve the game
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🐛
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen for context.
      placeholder: |
        I answered a question correctly, but...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: What browser and OS are you using?
      placeholder: e.g. Chrome 120 on Windows 11, Safari on iOS 17
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Error Logs
      description: If applicable, add screenshots or copy-paste error logs.
